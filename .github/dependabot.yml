# Dependabot version updates (security updates are enabled separately in the repo settings and
# are not affected by this file). Patch and minor updates are grouped into one PR per ecosystem
# per week and auto-merged by dependabot-automerge.yml once the required checks pass (except
# GitHub Actions, see below); majors arrive as individual PRs and are reviewed and merged by hand. See
# _bmad-artifacts/implementation/spec-dependabot-version-updates-auto-merge.md.
#
# `cooldown` delays a freshly published version by a few days before Dependabot proposes it, so a
# compromised release is more likely to be yanked before it can be auto-merged and deployed.
# Cooldown does not apply to security updates.
version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment (actions/checkout@<sha> # v7.0.1),
  # so Dependabot proposes minor and patch bumps too, SHA and comment together. These PRs are
  # never auto-merged (dependabot-automerge.yml skips github_actions): an action runs with the
  # deploy identity's token on main, so read the SHA diff and merge by hand. The group below keeps
  # it to one weekly PR for all action bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
