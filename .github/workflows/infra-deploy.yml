name: Infrastructure Deploy

# Deploy-only workflow for infra/** — never runs against pull requests. Story 1.4 owns a
# separate, read-only what-if-only workflow scoped to its own federated credential subject.
on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

# Shared with app-deploy.yml's concurrency group (not just this workflow's own runs): the two
# workflows write to the same Container App, and if they raced each other, infra-deploy.yml could
# read app-deploy.yml's pre-update image and reapply it after app-deploy.yml finishes, clobbering
# the fresh deploy. One shared group makes infra-deploy.yml and app-deploy.yml mutually exclusive.
concurrency:
  group: infra-app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Azure infrastructure
    runs-on: ubuntu-latest
    # workflow_dispatch can be run from any ref; push is already restricted to main by the
    # trigger above, but this guard keeps manual runs from deploying an untested branch to the
    # shared production resource group.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # OIDC federated-credential login — no client-secret input, ever (AC #2). The App
      # Registration/managed identity and its federated credential (trusting this repo's
      # main-branch subject) are already bootstrapped; see infra/README.md.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Reads back whatever image is currently running so the Deploy/What-if steps below can
      # re-apply it — az deployment group create's incremental mode still unconditionally
      # overwrites properties.template.containers[0].image with whatever the template says,
      # since the property is always present in the template (just bound to placeholderImage).
      # Empty output means no Container App exists yet (brand-new environment, AC #2); that's the
      # expected first-deploy case, not an error, so this step does not exit 1 the way
      # app-deploy.yml's "Resolve Container App name" step does.
      - name: Resolve current Container App image (if any)
        id: currentimage
        run: |
          APP_NAME=$(az containerapp list --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} --query "[0].name" -o tsv)
          if [ -z "$APP_NAME" ]; then
            echo "::notice::No Container App found — first deploy, placeholder image will be used"
            echo "image=" >> "$GITHUB_OUTPUT"
          else
            CURRENT_IMAGE=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
              --query properties.template.containers[0].image -o tsv)
            echo "::notice::Preserving currently-running image: $CURRENT_IMAGE"
            echo "image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      # Human-reviewable diff on manual runs only — does not gate or replace the deploy step
      # below; az deployment group create's own incremental-mode semantics are what actually
      # provide idempotency (AC #3).
      - name: What-if (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          DATABASE_ADMIN_PASSWORD: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          CURRENT_IMAGE: ${{ steps.currentimage.outputs.image }}
        run: |
          DEPLOY_PARAMS=(infra/main.bicepparam)
          if [ -n "$CURRENT_IMAGE" ]; then
            DEPLOY_PARAMS+=(placeholderImage="$CURRENT_IMAGE")
          fi
          az deployment group what-if \
            --name "infra-deploy-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP_NAME }}" \
            --template-file infra/main.bicep \
            --parameters "${DEPLOY_PARAMS[@]}"

      - name: Deploy
        env:
          DATABASE_ADMIN_PASSWORD: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          CURRENT_IMAGE: ${{ steps.currentimage.outputs.image }}
        run: |
          DEPLOY_PARAMS=(infra/main.bicepparam)
          if [ -n "$CURRENT_IMAGE" ]; then
            DEPLOY_PARAMS+=(placeholderImage="$CURRENT_IMAGE")
          fi
          az deployment group create \
            --name "infra-deploy-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP_NAME }}" \
            --template-file infra/main.bicep \
            --parameters "${DEPLOY_PARAMS[@]}"
