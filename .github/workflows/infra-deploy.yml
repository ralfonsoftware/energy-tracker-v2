name: Infrastructure Deploy

# Deploy-only workflow for infra/** — never runs against pull requests. Story 1.4 owns a
# separate, read-only what-if-only workflow scoped to its own federated credential subject.
on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

# Prevents overlapping az deployment group create/what-if runs against the same resource group
# (e.g. a workflow_dispatch run firing while a push-triggered run is still in progress).
concurrency:
  group: infra-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Azure infrastructure
    runs-on: ubuntu-latest
    # workflow_dispatch can be run from any ref; push is already restricted to main by the
    # trigger above, but this guard keeps manual runs from deploying an untested branch to the
    # shared production resource group.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # OIDC federated-credential login — no client-secret input, ever (AC #2). The App
      # Registration/managed identity and its federated credential (trusting this repo's
      # main-branch subject) are already bootstrapped; see infra/README.md.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Human-reviewable diff on manual runs only — does not gate or replace the deploy step
      # below; az deployment group create's own incremental-mode semantics are what actually
      # provide idempotency (AC #3).
      - name: What-if (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          DATABASE_ADMIN_PASSWORD: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
        run: |
          az deployment group what-if \
            --name "infra-deploy-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP_NAME }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

      - name: Deploy
        env:
          DATABASE_ADMIN_PASSWORD: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
        run: |
          az deployment group create \
            --name "infra-deploy-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP_NAME }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam
