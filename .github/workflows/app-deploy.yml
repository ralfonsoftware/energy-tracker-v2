name: App Deploy

# Build/test/deploy workflow for the application itself — every push to main rebuilds, retests,
# and redeploys the app (AC #1), regardless of which files changed. Unlike infra-deploy.yml this
# has no `paths:` filter: that workflow is scoped to `infra/**` to avoid redeploying infra on
# every app-only change, a rationale that doesn't apply here.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'EnergyTracker.sln'
      - 'global.json'
      - 'Dockerfile'
      - 'Directory.Packages.props'
      - '.github/workflows/app-deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

# Prevents overlapping runs from racing each other against the same Container App revision.
concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify running on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow only deploys from main (got ${{ github.ref }}). Re-run workflow_dispatch selecting the main branch."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      # --- Build & test (AC #1) ---------------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore .NET solution
        run: dotnet restore EnergyTracker.sln

      # Release, to match the configuration the Docker image actually publishes (Dockerfile:
      # `dotnet publish ... -c Release`) — gating on Debug would test a different build than what
      # gets deployed.
      - name: Build .NET solution
        run: dotnet build EnergyTracker.sln --no-restore --configuration Release

      # Must run before "Test .NET solution" below: EnergyTracker.Api.Tests.AuthenticationTests
      # asserts GET / falls back to the built SPA shell (wwwroot/index.html), matching AD-13's
      # single-artifact deployment model where the frontend is always built before the API serves
      # it. Running the .NET tests first (the original step order) leaves wwwroot with only the
      # committed .gitkeep placeholder, so that assertion 404s on a clean checkout — it only
      # happened to pass locally when a stale wwwroot/ build from an earlier `npm run build`
      # was still sitting on disk.
      #
      # node-version matches the Dockerfile's node:22-alpine build stage exactly. web/package.json's
      # @types/node devDependency is ^24, but that's a type-checking version, not the actual Node
      # runtime the shipped image builds/runs with.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Build frontend
        run: npm --prefix web run build

      - name: Test frontend
        run: npm --prefix web run test

      # Runs all three test projects (Api.Tests, Infrastructure.Tests, Architecture.Tests) via the
      # Microsoft.Testing.Platform runner (global.json). Infrastructure.Tests uses Testcontainers,
      # which drives Docker directly — ubuntu-latest ships Docker pre-installed, so no extra
      # `services:` config is needed. A non-zero exit here fails the job and blocks every later
      # step (build/push/deploy never runs).
      - name: Test .NET solution
        run: dotnet test EnergyTracker.sln --no-restore --configuration Release

      # --- Build & push Docker image (AC #2, #5) ------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # OIDC federated-credential login — no client-secret input, ever (AC #3). Reuses the same
      # pre-provisioned identity/federated credential infra-deploy.yml already uses.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --- Apply pending EF Core migrations (fixes: production /login 500s when a schema change
      # ships without a corresponding migration-apply step) -------------------------------------
      # SQL server name embeds uniqueString(resourceGroup().id), a token not known at
      # workflow-authoring time — always resolve it at runtime, never hardcode it. Exactly one SQL
      # server exists in this resource group by design.
      - name: Resolve SQL Server name
        id: sqlserver
        timeout-minutes: 5
        run: |
          SERVER_NAME=$(az sql server list --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} --query "[0].name" -o tsv)
          if [ -z "$SERVER_NAME" ]; then
            echo "::error::No SQL Server found in resource group ${{ vars.AZURE_RESOURCE_GROUP_NAME }}"
            exit 1
          fi
          echo "name=$SERVER_NAME" >> "$GITHUB_OUTPUT"

      # The SQL Server firewall only allows Azure-internal traffic (see
      # infra/modules/database-sqlserver.bicep's AllowAzureServices rule) — the GitHub-hosted
      # runner needs its own public IP whitelisted before it can reach the server to migrate it.
      - name: Determine GitHub runner public IP
        id: runnerip
        timeout-minutes: 5
        run: |
          RUNNER_IP=$(curl -s --retry 3 --retry-delay 2 https://api.ipify.org)
          if ! [[ "$RUNNER_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::error::api.ipify.org did not return a valid IPv4 address (got: '$RUNNER_IP')"
            exit 1
          fi
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      # Rule name is deterministic (keyed on github.run_id) rather than a random token, so the
      # cleanup step below needs no extra output plumbing — it can reference the same name
      # directly. Scoped to exactly this run's IP so no other run's traffic is admitted.
      - name: Whitelist runner IP for migration
        timeout-minutes: 5
        run: |
          az sql server firewall-rule create \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --server ${{ steps.sqlserver.outputs.name }} \
            --name "gh-actions-migrate-${{ github.run_id }}" \
            --start-ip-address ${{ steps.runnerip.outputs.ip }} \
            --end-ip-address ${{ steps.runnerip.outputs.ip }}

      # dotnet-ef is a local tool (.config/dotnet-tools.json) — must be restored before `dotnet ef`
      # is callable. Connection string mirrors infra/modules/database-sqlserver.bicep's
      # `connectionString` output exactly; login `etadmin` must stay in sync with
      # infra/main.bicepparam's `databaseAdministratorLogin`. Never echoed — only referenced via
      # the shell variable, never printed to the log. Password is double-quote-escaped per the
      # documented ADO.NET connection-string syntax (learn.microsoft.com/dotnet/framework/data/
      # adonet/connection-strings): values containing `;`/whitespace/control chars must be
      # wrapped in single or double quotes, with any embedded quote-of-that-kind doubled. ADO.NET
      # does NOT use ODBC's `{}` quoting convention — that's a different, opt-in parser mode
      # (DbConnectionStringBuilder(useOdbcRules: true)) that plain connection strings don't use.
      # Retries with backoff: Azure SQL firewall rule changes can take up to 5 minutes to
      # propagate, so the first attempt(s) immediately after rule creation may legitimately fail.
      - name: Apply pending EF Core migrations
        timeout-minutes: 10
        env:
          DATABASE_ADMIN_PASSWORD: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
        run: |
          dotnet tool restore

          SQL_FQDN=$(az sql server show \
            --name ${{ steps.sqlserver.outputs.name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --query fullyQualifiedDomainName -o tsv)
          if [ -z "$SQL_FQDN" ]; then
            echo "::error::SQL Server ${{ steps.sqlserver.outputs.name }} returned an empty fullyQualifiedDomainName"
            exit 1
          fi

          ESCAPED_PASSWORD="${DATABASE_ADMIN_PASSWORD//\"/\"\"}"
          CONNECTION_STRING="Server=tcp:${SQL_FQDN},1433;Database=energytracker;User ID=etadmin;Password=\"${ESCAPED_PASSWORD}\";Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

          for attempt in 1 2 3 4 5; do
            if dotnet ef database update \
              --project src/EnergyTracker.Infrastructure.Migrations.SqlServer \
              --startup-project src/EnergyTracker.Infrastructure.Migrations.SqlServer \
              --context EnergyTrackerDbContext \
              --connection "$CONNECTION_STRING"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Migration failed after 5 attempts — this can happen if Azure SQL firewall propagation (up to 5 minutes) hadn't completed, or the migration itself is broken"
              exit 1
            fi
            echo "Migration attempt $attempt failed, retrying in 30s (Azure SQL firewall rule changes can take a few minutes to propagate)..."
            sleep 30
          done

      # Guaranteed to run even if the migration step above fails, so no temporary public firewall
      # exposure is ever left lingering on the SQL server. continue-on-error so a transient Azure
      # API error on the delete call doesn't block the ACR/deploy steps below — the migration
      # itself already succeeded or failed by this point, and cleanup failing here is a residual
      # firewall-exposure risk, not a reason to also block shipping the app. Skipped entirely (via
      # the outputs.name check) when "Resolve SQL Server name" itself never succeeded, since there
      # would be no rule to delete.
      - name: Remove GitHub runner IP from SQL firewall
        if: always() && steps.sqlserver.outputs.name != ''
        continue-on-error: true
        timeout-minutes: 5
        run: |
          az sql server firewall-rule delete \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --server ${{ steps.sqlserver.outputs.name }} \
            --name "gh-actions-migrate-${{ github.run_id }}" \
            || echo "::warning::Failed to remove temporary firewall rule gh-actions-migrate-${{ github.run_id }} — it may need manual cleanup on SQL Server ${{ steps.sqlserver.outputs.name }}"

      # ACR name embeds uniqueString(resourceGroup().id), a token not known at workflow-authoring
      # time — always resolve it at runtime, never hardcode it. Exactly one ACR exists in this
      # resource group by design.
      - name: Resolve ACR login server
        id: acr
        run: |
          LOGIN_SERVER=$(az acr list --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} --query "[0].loginServer" -o tsv)
          if [ -z "$LOGIN_SERVER" ]; then
            echo "::error::No ACR found in resource group ${{ vars.AZURE_RESOURCE_GROUP_NAME }}"
            exit 1
          fi
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: ACR login
        run: az acr login --name $(echo "${{ steps.acr.outputs.login_server }}" | cut -d. -f1)

      # Computed once here and threaded through both the push step and the deploy step below —
      # recomputing `date -u +...` a second time in the deploy step would drift by a minute and
      # reference a tag that was never pushed.
      - name: Compute image tag
        id: tag
        run: |
          IMAGE_TAG="$(date -u +%Y%m%dT%H%M)-$(git rev-parse --short=11 HEAD)"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.acr.outputs.login_server }}/energy-tracker:${{ steps.tag.outputs.image_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      # --- Deploy new revision and health-gate (AC #3, #4) ---------------------------------------
      # Container App name is not authored by this workflow — resolve it at runtime rather than
      # hardcoding, defensive against a future environmentName change. Exactly one exists in this
      # resource group by design.
      - name: Resolve Container App name
        id: app
        run: |
          APP_NAME=$(az containerapp list --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} --query "[0].name" -o tsv)
          if [ -z "$APP_NAME" ]; then
            echo "::error::No Container App found in resource group ${{ vars.AZURE_RESOURCE_GROUP_NAME }}"
            exit 1
          fi
          echo "name=$APP_NAME" >> "$GITHUB_OUTPUT"

      # Idempotent — safe to run on every deploy, not just once. Corrects the two gaps Story 1.2
      # deliberately left open (see Task 1 / infra/modules/container-app.bicep, infra/main.bicep)
      # independent of whether infra-deploy.yml has been re-run since those Bicep edits landed.
      #
      # --target-port 8080 here must be kept in sync with `containerAppTargetPort`'s default in
      # infra/main.bicep — this CLI call runs on every push and will silently overwrite the live
      # port back to 8080 even if that Bicep default is ever changed without updating this value.
      - name: Ensure ACR pull credential and target port
        run: |
          az containerapp registry set \
            --name ${{ steps.app.outputs.name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --server ${{ steps.acr.outputs.login_server }} \
            --identity system
          az containerapp ingress update \
            --name ${{ steps.app.outputs.name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --target-port 8080

      # Captured before the update so a failed health check below has something concrete to roll
      # back to — redeploying this exact image reference is the same, already-proven mechanism as
      # a normal deploy, rather than relying on revision activate/deactivate semantics.
      - name: Capture current image (pre-deploy, for rollback)
        id: pre
        run: |
          PREV_IMAGE=$(az containerapp show \
            --name ${{ steps.app.outputs.name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --query properties.template.containers[0].image -o tsv)
          echo "image=$PREV_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ${{ steps.app.outputs.name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --image ${{ steps.acr.outputs.login_server }}/energy-tracker:${{ steps.tag.outputs.image_tag }}

      # minReplicas: 0 (scale-to-zero, AD-6/AD-7) means the very first request after a deploy may
      # need to cold-start the revision — the retry loop below is generous on purpose so a
      # legitimately-slow-but-successful cold start doesn't make this flaky.
      #
      # Checks the just-deployed revision's own direct FQDN (properties.latestRevisionFqdn), not
      # the app's shared ingress FQDN: in single-revision mode Container Apps keeps the *old*
      # revision serving 100% of the shared FQDN's traffic until the new one passes the platform's
      # own (TCP-only) readiness probe, so hitting the shared FQDN here could get an immediate 200
      # from the old revision without ever having checked the new one at all.
      - name: Health check
        run: |
          NEW_FQDN=$(az containerapp show \
            --name ${{ steps.app.outputs.name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --query properties.latestRevisionFqdn -o tsv)

          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null --max-time 5 --connect-timeout 5 -w "%{http_code}" "https://$NEW_FQDN/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done

          echo "::error::New revision at https://$NEW_FQDN/health did not become healthy after 30 attempts (5 minutes) — rolling back to previous image ${{ steps.pre.outputs.image }}"
          az containerapp update \
            --name ${{ steps.app.outputs.name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
            --image ${{ steps.pre.outputs.image }}
          exit 1
