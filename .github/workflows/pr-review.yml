name: PR Review

# Runs on every pull request against main — build/test/lint always, infra what-if only when
# infra/** changed and the PR isn't from a fork. Never deploys anything (contrast with
# app-deploy.yml/infra-deploy.yml, which only run on push to main).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Workflow-level (not job-level): applies to both build-test-lint and validate-infra, so a rapid
# sequence of pushes to the same PR cancels stale runs of both jobs together. Deliberately the
# opposite of app-deploy.yml/infra-deploy.yml's cancel-in-progress: false — a PR check has no
# shared-live-resource race to avoid, and canceling a superseded run saves CI minutes on a commit
# nobody cares about anymore.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --- Build, test, and lint the .NET solution and web frontend (AC #1, #2) -------------------
  # No `name:` override — the reported status-check context must be the literal job id
  # (build-test-lint) to match required_status_checks.checks[].context in branch protection (see
  # infra/README.md). A display-name override here would silently desync from that requirement
  # and leave merges permanently blocked, since GitHub matches required checks by context/job id,
  # not by a human-friendly name.
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore .NET solution
        run: dotnet restore EnergyTracker.sln

      # Release, to match the configuration app-deploy.yml gates and Dockerfile actually publishes
      # — gating on Debug would test a different build than what gets deployed.
      - name: Build .NET solution
        run: dotnet build EnergyTracker.sln --no-restore --configuration Release

      # node-version must match the Dockerfile's frontend build stage (node:25-alpine) so CI tests
      # and builds on the Node the image builds with. Change both together (Dependabot bumps the
      # Dockerfile base image, not this value). web/package.json's @types/node devDependency is a
      # type-checking version, not the runtime.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25'

      - name: Install frontend dependencies
        run: npm --prefix web ci

      # Counterpart of the NuGet Audit gate (Directory.Build.props): a moderate-or-worse advisory in
      # a dependency that ships (devDependencies are excluded) fails the PR. Dev-only advisories
      # (the shadcn CLI) are listed in deferred-work-accepted.md instead. If the registry is down
      # this step fails like any other network step; re-run the job.
      - name: Audit frontend dependencies
        run: npm --prefix web audit --omit=dev --audit-level=moderate

      # Must run before "Test .NET solution" below: web/vite.config.ts's outDir points straight at
      # src/EnergyTracker.Api/wwwroot (gitignored, AD-13 single-artifact deployment), and
      # AuthenticationTests' SPA-shell test asserts GET / actually serves index.html from it. Any
      # .NET test run before this step sees an empty wwwroot and 404s instead (caught via a real
      # CI failure on an unrelated PR — this ordering bug predates that PR, discovered, not caused,
      # by it).
      - name: Build frontend
        run: npm --prefix web run build

      # Runs all three test projects (Api.Tests, Infrastructure.Tests, Architecture.Tests) via the
      # Microsoft.Testing.Platform runner (global.json). Infrastructure.Tests uses Testcontainers,
      # which drives Docker directly — ubuntu-latest ships Docker pre-installed, so no extra
      # `services:` config is needed, as app-deploy.yml already established.
      - name: Test .NET solution
        run: dotnet test EnergyTracker.sln --no-restore --configuration Release

      - name: Test frontend
        run: npm --prefix web run test

      # AC #2: frontend lint (oxlint) as its own step so a lint failure is individually visible in
      # the PR checks UI. No backend/.NET lint gate exists yet (no .editorconfig, no analyzers
      # configured in any .csproj) — deliberately not invented here; see story Dev Notes.
      - name: Lint frontend
        run: npm --prefix web run lint

      # Playwright test:e2e is deliberately not included in this gate — same reasoning
      # app-deploy.yml/Story 1.3 already established (epic AC only names "the test suite" without
      # specifying e2e; browser-install + server-spinup cost/flakiness isn't justified here).

  # --- Conditional, fork-safe infra what-if validation (AC #3, #4) ----------------------------
  # No `name:` override here either — same reasoning as build-test-lint above.
  validate-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `id-token: write` on build-test-lint — least-privilege boundary, only this job needs OIDC.
    permissions:
      id-token: write
      contents: read
    steps:
      # fetch-depth: 0 (full history) — this job diffs the PR's changed files against base. The
      # pull_request event's default checkout (refs/pull/N/merge) has no parent history available
      # in a depth-1 shallow clone, so a plain `git diff` against base.sha would fail.
      # No explicit `ref:` — this defaults to the PR's synthetic merge commit
      # (refs/pull/N/merge), not the PR head branch, so `what-if` below validates what deploying
      # *after* merging into main would look like. That's the right target for this check, but it
      # also means a PR with a real merge conflict against main fails this job for reasons
      # unrelated to the PR's own content.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # base.sha/head.sha are commit SHAs from the pull_request event payload, not free-form
      # attacker-controlled text, so interpolating them into `run:` here is safe.
      # `--no-renames` so a file moved out of infra/ still shows its old (infra/-prefixed) path
      # instead of only the new path, which `grep` would otherwise miss entirely. The diff is
      # written to a file so a `git diff` failure (bad SHA, transient error) is a distinct,
      # non-swallowed failure — the previous `git diff | grep` pipeline coerced any git diff
      # failure into `infra_changed=false` because only grep's exit code was checked. Matching is
      # restricted to `.bicep`/`.bicepparam` files so unrelated infra/-tree changes (e.g. this
      # file, infra/README.md) don't trigger an Azure login + what-if run.
      - name: Check for infra changes
        id: changes
        run: |
          git diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/changed-files.txt
          if grep -qE '^infra/.*\.(bicep|bicepparam)$' /tmp/changed-files.txt; then
            echo "infra_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Explicit, named guard rather than relying solely on GitHub's implicit platform behavior of
      # withholding secrets/OIDC tokens from fork-triggered pull_request runs. Making this visible
      # in the workflow's own logic is what makes AC #4 verifiable by reading the YAML — and gives
      # a fork PR touching infra/** a clear skip notice instead of an opaque azure/login failure.
      - name: Check if PR is from a fork
        id: origin
        run: echo "is_fork=${{ github.event.pull_request.head.repo.full_name != github.repository }}" >> "$GITHUB_OUTPUT"

      # Always runs (no `if:` restriction) so it never shows as "skipped" in the Actions UI —
      # the condition lives in the shell script instead, so the step's own presence/log is
      # evidence it executed, not just an artifact of GitHub's conditional-step rendering.
      - name: Notice — infra changed but validation skipped (fork PR)
        if: always()
        run: |
          if [ "${{ steps.changes.outputs.infra_changed }}" = "true" ] && [ "${{ steps.origin.outputs.is_fork }}" = "true" ]; then
            echo "::warning::infra/** changed in this fork PR; what-if validation was skipped (fork PRs never get Azure credentials) — a maintainer should check out the branch locally and run 'az deployment group what-if' before merging."
          fi

      # OIDC login as the PR identity (energy-tracker-pr-reader-uami): Reader on the target resource
      # group only, trusted only for the pull_request subject, no database user. The Owner-scoped
      # deploy identity (AZURE_CLIENT_ID) is reachable only from main, so a branch push cannot act
      # as the deploy identity (audit S11, Story 11.5). Tenant and subscription ids are shared.
      - name: Azure login (OIDC)
        if: steps.changes.outputs.infra_changed == 'true' && steps.origin.outputs.is_fork == 'false'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_PR_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fails fast, before what-if, if the PR identity lost a right it needs (read) or gained one it
      # must not have (any write, or reach beyond the target resource group). What is probed and
      # why: infra/README.md, "Workflow identities and their permissions".
      - name: "Preflight: identity permissions"
        if: steps.changes.outputs.infra_changed == 'true' && steps.origin.outputs.is_fork == 'false'
        env:
          AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: scripts/ci/azure-preflight.sh pr

      - name: Resolve current Container App image (if any)
        id: currentimage
        if: steps.changes.outputs.infra_changed == 'true' && steps.origin.outputs.is_fork == 'false'
        run: |
          APP_NAME=$(az containerapp list --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} --query "[0].name" -o tsv)
          if [ -z "$APP_NAME" ]; then
            echo "::notice::No Container App found — first deploy, placeholder image will be used"
            echo "image=" >> "$GITHUB_OUTPUT"
          else
            CURRENT_IMAGE=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP_NAME }} \
              --query properties.template.containers[0].image -o tsv)
            echo "::notice::Preserving currently-running image: $CURRENT_IMAGE"
            echo "image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      # Read-only what-if only — never `az deployment group create`. That's infra-deploy.yml's
      # exclusive job, gated to push on main only. Same mechanism as infra-deploy.yml's manual
      # what-if step, with two differences for the Reader-only PR identity:
      # - `--validation-level ProviderNoRbac`: the default level checks the same (write) permissions
      #   as the deployment itself and would deny a Reader; this level checks read permissions only.
      #   Needs Azure CLI 2.76.0 or newer (the preflight checks that).
      # - DATABASE_ADMIN_PASSWORD and OIDC_CLIENT_SECRET are inert placeholders, not the repository
      #   secrets: what-if never deploys or shows secure parameter values, so the real ones are not
      #   needed here and a PR branch has no reason to receive them through this workflow.
      - name: What-if validation
        if: steps.changes.outputs.infra_changed == 'true' && steps.origin.outputs.is_fork == 'false'
        env:
          DATABASE_ADMIN_PASSWORD: 'Placeholder-not-a-secret-0a1B2c3D!'
          OIDC_CLIENT_SECRET: 'unset'
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          AZURE_ALERT_OTEL_CAP_EMAIL: ${{ vars.AZURE_ALERT_OTEL_CAP_EMAIL }}
          CURRENT_IMAGE: ${{ steps.currentimage.outputs.image }}
        run: |
          az deployment group what-if \
            --name "pr-review-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP_NAME }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --validation-level ProviderNoRbac
