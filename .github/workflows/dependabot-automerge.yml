name: Dependabot Auto-merge

# Enables GitHub auto-merge (squash) on Dependabot PRs that are patch or minor updates. The PR
# still merges only after the branch-protection checks (build-test-lint, validate-infra) pass and
# the branch is up to date with main (strict: true), so a failing or stale PR just waits. A PR
# that falls behind main is rebased by hand with `@dependabot rebase`.
#
# Majors are never enabled here. Merging to main deploys (app-deploy.yml), so the allowed
# update types are the whole safety boundary: change them only with a matching spec update.
#
# GitHub Actions updates are never enabled either, whatever the update type (Story 11.5, AC #8).
# Actions are pinned to commit SHAs, so Dependabot proposes minor and patch bumps as well, and an
# action runs with the deploy identity's OIDC token on main. Those PRs are merged by hand after
# reading the SHA diff. `package-ecosystem` is the spelling Dependabot uses in its branch names
# (dependabot/github_actions/...), not the `github-actions` of dependabot.yml.
on:
  pull_request:
    branches: [main]

# Dependabot-triggered runs get a read-only token by default; this block raises it for this
# workflow only. contents: write lets `gh pr merge --auto` queue the merge, pull-requests: write
# lets it edit the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # github.actor (not the PR author): a human pushing to a Dependabot branch must not
    # (re-)enable auto-merge for code Dependabot did not write.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # dependency-group is only set for the grouped PRs defined in .github/dependabot.yml, which
      # are restricted to minor and patch updates there. Ungrouped PRs (majors, and security
      # updates) are judged by update-type.
      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.package-ecosystem != 'github_actions'
          && (steps.metadata.outputs.dependency-group != ''
          || steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Leave major and GitHub Actions updates for manual review
        if: >-
          steps.metadata.outputs.package-ecosystem == 'github_actions'
          || (steps.metadata.outputs.dependency-group == ''
          && steps.metadata.outputs.update-type != 'version-update:semver-patch'
          && steps.metadata.outputs.update-type != 'version-update:semver-minor')
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: echo "::notice::$ECOSYSTEM $UPDATE_TYPE update, auto-merge not enabled. Merge by hand after review (for GitHub Actions, read the SHA diff first)."
