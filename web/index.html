<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F8ED" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12201A" />
    <title>Energy Tracker</title>
    <script>
      // Applied synchronously, before CSS paints, to avoid a flash of the
      // wrong theme. src/lib/color-scheme.ts re-applies this on the OS
      // 'change' event once the app has mounted.
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
